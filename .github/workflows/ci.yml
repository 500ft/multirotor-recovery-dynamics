name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "task/priority-one-*", "study/**", "week/**"]

jobs:
  analysis-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Run preregistered gates and repository tests
        run: python -m unittest discover -s Analysis/tests -v
      - name: Survivable-set pipeline smoke (writes nothing)
        run: python -m Analysis.run_survivable_set --smoke --workers 2
      - name: Check README links, identity and negative controls
        run: |
          python tools/check_presentation.py . "Multirotor Recovery Dynamics" multirotor-recovery-dynamics
          python tools/test_presentation.py
